<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131d"><title>FocusFlow — Focus, one task at a time</title><style>
:root{color-scheme:dark;--bg:#10131d;--panel:#191e2b;--line:#2b3345;--text:#f5f7fb;--muted:#9ca8bc;--mint:#8ce7c1;--blue:#8fa7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#263a43 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}.shell{max-width:1080px;margin:auto;padding:34px 22px}.top,.row,.task,.controls{display:flex;align-items:center;justify-content:space-between;gap:14px}.top{margin-bottom:48px}.brand{font-weight:800;letter-spacing:-.04em;font-size:1.25rem}.brand b{color:var(--mint)}.pill,.tag{border:1px solid var(--line);border-radius:99px;color:var(--muted);padding:6px 12px;font-size:.8rem}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:24px}.panel{background:linear-gradient(145deg,#1d2432,#151a25);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 24px 70px #0003}.eyebrow{color:var(--mint);font-size:.76rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.05;letter-spacing:-.06em;margin:10px 0}p{color:var(--muted)}.inputrow{display:flex;gap:9px;margin:24px 0}input{min-width:0;flex:1;background:#111621;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px 15px}button.primary{background:var(--mint);color:#102019;border:0;border-radius:12px;padding:12px 17px;font-weight:800}.filters{display:flex;gap:8px;margin-bottom:14px}.filters button,.soft{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}.filters button.active{color:var(--mint);border-color:var(--mint)}.tasks{display:grid;gap:9px}.task{background:#111621;border:1px solid #242c3b;padding:12px 14px;border-radius:12px}.task label{display:flex;align-items:center;gap:10px;flex:1}.task input{flex:initial;accent-color:var(--mint)}.task.done span{text-decoration:line-through;color:#68758a}.del{border:0;background:none;color:#8390a4;font-size:1.1rem}.timer{text-align:center}.clock{font-size:clamp(3.5rem,10vw,6rem);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.06em;margin:14px 0}.controls{justify-content:center}.soft{color:var(--text)}.progress{height:7px;background:#283143;border-radius:10px;margin:20px 0;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--blue));transition:width .3s}.stats{display:flex;gap:12px;margin-top:15px}.stat{flex:1;padding:14px;border-radius:14px;background:#111621}.stat strong{display:block;font-size:1.4rem}.stat small{color:var(--muted)}footer{text-align:center;color:#68758a;padding:28px 0;font-size:.85rem}@media(max-width:720px){.layout{grid-template-columns:1fr}.top{margin-bottom:30px}.shell{padding:22px 15px}.panel{padding:20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main class="shell"><header class="top"><a class="brand" href="../../index.html" style="color:inherit;text-decoration:none">focus<b>flow</b></a><span class="pill">BEGINNER · VANILLA JS</span></header><div class="layout"><section class="panel"><div class="eyebrow">Your workspace</div><h1>Make room for<br>deep work.</h1><p>Choose one useful thing. Start small, stay present.</p><form class="inputrow" id="addForm"><input id="newTask" placeholder="Add a task for today…" maxlength="90" aria-label="New task"><button class="primary">Add task</button></form><div class="filters" aria-label="Filter tasks"><button class="active" data-filter="all">All</button><button data-filter="active">To do</button><button data-filter="done">Done</button></div><div class="tasks" id="tasks"></div><div class="progress"><i id="progress"></i></div><div class="row"><small id="taskCount" style="color:var(--muted)"></small><button class="soft" id="clearDone">Clear completed</button></div></section><aside class="panel timer"><div class="eyebrow">Pomodoro focus</div><div class="clock" id="clock">25:00</div><p id="timerLabel">Ready when you are</p><div class="controls"><button class="primary" id="start">Start focus</button><button class="soft" id="reset">Reset</button></div><div class="stats"><div class="stat"><strong id="sessions">0</strong><small>sessions today</small></div><div class="stat"><strong>25/5</strong><small>focus / break</small></div></div></aside></div><footer>FocusFlow · Keep your attention where it matters.</footer></main><script>
const $=s=>document.querySelector(s);let items;try{items=JSON.parse(localStorage.focusflowTasks||'[]')}catch{items=[]}let filter='all',remaining=1500,tick=null,sessions=Number(localStorage.focusflowSessions||0);function save(){localStorage.focusflowTasks=JSON.stringify(items);render()}function render(){const shown=items.filter(x=>filter==='all'||(filter==='done'?x.done:!x.done));$('#tasks').innerHTML=shown.length?shown.map(x=>`<div class="task ${x.done?'done':''}"><label><input type="checkbox" data-id="${x.id}" ${x.done?'checked':''}><span>${escapeHtml(x.text)}</span></label><button class="del" data-del="${x.id}" aria-label="Delete task">×</button></div>`).join(''):'<p style="text-align:center;padding:15px">Nothing here yet. Add a task above.</p>';let done=items.filter(x=>x.done).length;$('#taskCount').textContent=`${done} of ${items.length} completed`;$('#progress').style.width=items.length?done/items.length*100+'%':'0%';$('#sessions').textContent=sessions}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('#addForm').onsubmit=e=>{e.preventDefault();let text=$('#newTask').value.trim();if(!text)return;items.unshift({id:Date.now(),text,done:false});$('#newTask').value='';save()};$('#tasks').onclick=e=>{let id=Number(e.target.dataset.id),del=Number(e.target.dataset.del);if(id){items=items.map(x=>x.id===id?{...x,done:e.target.checked}:x);save()}if(del){items=items.filter(x=>x.id!==del);save()}};document.querySelector('.filters').onclick=e=>{if(!e.target.dataset.filter)return;filter=e.target.dataset.filter;document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('active',b===e.target));render()};$('#clearDone').onclick=()=>{items=items.filter(x=>!x.done);save()};function showTime(){$('#clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}$('#start').onclick=()=>{if(tick){clearInterval(tick);tick=null;$('#start').textContent='Resume focus';$('#timerLabel').textContent='Paused';return}$('#start').textContent='Pause';$('#timerLabel').textContent='You are in a focus session';tick=setInterval(()=>{remaining--;showTime();if(remaining<=0){clearInterval(tick);tick=null;sessions++;localStorage.focusflowSessions=sessions;$('#sessions').textContent=sessions;$('#start').textContent='Start focus';$('#timerLabel').textContent='Session complete — take a short break';remaining=1500;showTime()}},1000)};$('#reset').onclick=()=>{clearInterval(tick);tick=null;remaining=1500;showTime();$('#start').textContent='Start focus';$('#timerLabel').textContent='Ready when you are'};render();
</script></body></html>
